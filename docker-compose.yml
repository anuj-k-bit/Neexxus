version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-rag-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8080
    volumes:
      - ./qdrant_local:/app/qdrant_local
      - ./DATA:/app/DATA
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-rag-ui
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
